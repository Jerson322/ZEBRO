<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEBRO · Sistema</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --fondo: #f4f4f2;
      --panel: #fff;
      --texto: #1a1a1a;
      --suave: #6b6b6b;
      --borde: #e2e2de;
      --menu: #111;
      --positivo: #1b7f4b;
      --negativo: #c0362c;
      --alerta: #fdf1dc;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    .app { display: flex; min-height: 100%; }
    nav {
      width: 200px;
      flex-shrink: 0;
      background: var(--menu);
      color: #fff;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    nav .marca { font-weight: 700; letter-spacing: 2px; font-size: 20px; padding: 6px 10px 16px; }
    nav a {
      color: #cfcfcf;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
    }
    nav a:hover { color: #fff; }
    nav[hidden] { display: none; }
    nav .pie { margin-top: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; color: #aaa; }
    .negativo-claro { color: #ff9c92; }
    .acceso { max-width: 360px; margin: 10vh auto 0; display: flex; flex-direction: column; gap: 12px; }
    .acceso h1 { letter-spacing: 2px; }
    .acceso p { margin: 0; }
    nav a.activo { background: #fff; color: #000; font-weight: 600; }
    main { flex: 1; min-width: 0; padding: 24px; max-width: 1100px; }
    .encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tarjeta, .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 14px; }
    .panel { margin-bottom: 16px; overflow-x: auto; }
    .tarjeta small { color: var(--suave); display: block; margin-bottom: 4px; }
    .tarjeta strong { font-size: 21px; }
    .columnas { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .columnas .panel { margin-bottom: 0; }
    .columnas { margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 13px; color: var(--suave); font-weight: 600; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.ancho { white-space: normal; min-width: 140px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .positivo { color: var(--positivo); }
    .negativo { color: var(--negativo); }
    .suave { color: var(--suave); }
    .vacio { color: var(--suave); padding: 12px 0; margin: 0; }
    .alerta { background: var(--alerta); border: 1px solid #efd9ad; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
    .etiqueta { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--fondo); }
    .anulada td { color: var(--suave); text-decoration: line-through; }
    .anulada td.acciones { text-decoration: none; }
    .acciones { text-align: right; }
    button, .boton {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--texto);
      display: inline-block;
    }
    button.principal { background: #111; border-color: #111; color: #fff; font-weight: 600; }
    button.chico { padding: 4px 8px; font-size: 13px; }
    button.peligro { color: var(--negativo); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--suave); }
    input, select {
      font: inherit;
      color: var(--texto);
      background: var(--panel);
      padding: 8px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      width: 100%;
      min-width: 0;
    }
    .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .filtros label { width: 160px; }
    dialog {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 0;
      background: var(--panel);
      color: var(--texto);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    dialog form, .comprobante { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    dialog h2 { margin: 0; font-size: 18px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .linea { display: grid; grid-template-columns: 1fr 70px 110px 32px; gap: 8px; align-items: center; }
    .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; border-top: 1px solid var(--borde); padding-top: 10px; }
    .error { color: var(--negativo); margin: 0; font-size: 14px; }
    .botones { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      nav {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 8px;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      nav .marca { padding: 10px 8px; font-size: 16px; }
      nav a { white-space: nowrap; padding: 10px 12px; }
      nav .pie { margin: 0 0 0 auto; padding: 4px 8px; flex-direction: row; align-items: center; white-space: nowrap; }
      main { padding: 16px; }
      .linea { grid-template-columns: 1fr 60px 90px 32px; }
    }
    @media print {
      body > .app { display: none; }
      dialog { position: static; border: 0; width: 100%; max-height: none; }
      dialog::backdrop { display: none; }
      .botones { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav id="menu"></nav>
    <main id="vista"></main>
  </div>
  <dialog id="dialogo"></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script type="module" src="/sistema/app.js"></script>
</body>
</html>
