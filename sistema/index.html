<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ZEBRO · Restaurante</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f5f6fa;
      --panel: #ffffff;
      --texto: #14161f;
      --suave: #6b7080;
      --borde: #e8e9ef;
      --acento: #ff5a1f;
      --acento-suave: #fff1eb;
      --acento-oscuro: #e04a12;
      --positivo: #16a34a;
      --positivo-suave: #e9f8ef;
      --negativo: #dc2626;
      --negativo-suave: #fdecec;
      --alerta: #b45309;
      --alerta-suave: #fff6e0;
      --sombra: 0 1px 2px rgba(20, 22, 31, 0.04), 0 4px 16px rgba(20, 22, 31, 0.06);
      --sombra-alta: 0 12px 40px rgba(20, 22, 31, 0.18);
      --radio: 16px;
      --radio-chico: 10px;
      --menu-ancho: 248px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    .icono { width: 20px; height: 20px; flex-shrink: 0; }

    /* Estructura y menú lateral */
    .app { display: flex; min-height: 100vh; }
    nav {
      width: var(--menu-ancho);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--borde);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    nav[hidden] { display: none; }
    .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: 1.5px; padding: 0 8px; }
    .logo {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
      background: var(--texto); color: #fff; font-weight: 800; font-size: 18px; letter-spacing: 0;
    }
    .logo.con-imagen { background: transparent; overflow: hidden; }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .logo-ajustes { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .logo-grande { width: 72px; height: 72px; border-radius: 20px; font-size: 32px; }
    .logo-grande:has(img) { background: var(--fondo); }

    /* Bienvenida al entrar */
    #bienvenida {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; cursor: pointer;
      background: radial-gradient(circle at 50% 40%, #2a2d3a 0%, #14161f 70%); color: #fff;
      animation: bv-entrar 0.4s ease-out both;
    }
    #bienvenida.saliendo { animation: bv-salir 0.5s ease-in forwards; }
    .bv-brillo {
      position: absolute; width: 520px; height: 520px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 90, 31, 0.45), transparent 65%); filter: blur(20px);
      animation: bv-latido 2.4s ease-in-out infinite;
    }
    .bv-centro { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; text-align: center; }
    .bv-logo {
      width: 112px; height: 112px; border-radius: 30px; font-size: 52px; background: var(--acento); color: #fff;
      box-shadow: 0 20px 60px rgba(255, 90, 31, 0.45); margin-bottom: 10px;
      animation: bv-logo 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }
    .bv-logo.con-imagen { background: #fff; padding: 10px; }
    .bv-hola { margin: 0; font-size: 18px; color: rgba(255, 255, 255, 0.75); animation: bv-subir 0.6s ease-out 0.5s both; }
    .bv-nombre { margin: 0; font-size: clamp(34px, 8vw, 60px); font-weight: 800; letter-spacing: 2px; animation: bv-subir 0.7s ease-out 0.7s both; }
    .bv-rol { margin: 0; font-size: 15px; color: #ffb38f; animation: bv-subir 0.6s ease-out 0.95s both; }
    .bv-carga { width: 160px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); margin-top: 18px; overflow: hidden; }
    .bv-carga span { display: block; height: 100%; background: var(--acento); animation: bv-cargar 2.4s ease-in-out 0.3s both; }
    @keyframes bv-entrar { from { opacity: 0; } }
    @keyframes bv-salir { to { opacity: 0; transform: scale(1.04); } }
    @keyframes bv-logo { from { opacity: 0; transform: scale(0.3) rotate(-25deg); } }
    @keyframes bv-subir { from { opacity: 0; transform: translateY(18px); } }
    @keyframes bv-cargar { from { width: 0; } to { width: 100%; } }
    @keyframes bv-latido { 50% { transform: scale(1.12); opacity: 0.75; } }
    @media (prefers-reduced-motion: reduce) {
      #bienvenida, #bienvenida *, #bienvenida.saliendo { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }

    .secciones { display: flex; flex-direction: column; gap: 4px; }
    .secciones a {
      display: flex; align-items: center; gap: 12px;
      color: var(--suave); text-decoration: none; font-weight: 500;
      padding: 11px 12px; border-radius: 12px; transition: background 0.15s, color 0.15s;
    }
    .secciones a:hover { background: var(--fondo); color: var(--texto); }
    .secciones a.activo { background: var(--acento-suave); color: var(--acento-oscuro); font-weight: 600; }
    nav .pie { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
    .comandera {
      display: flex; flex-direction: row; align-items: center; gap: 8px; cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 500; color: var(--suave); padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--borde);
    }
    .comandera input { width: auto; min-height: 0; accent-color: var(--acento); margin: 0; }
    .comandera:has(input:checked) { border-style: solid; border-color: var(--acento); color: var(--acento-oscuro); background: var(--acento-suave); }
    .usuario { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--fondo); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      background: var(--acento); color: #fff; font-weight: 700;
    }
    .quien { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; }
    .quien strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quien small { color: var(--suave); font-size: 12px; }
    .icono-boton { padding: 8px; min-height: 0; border: 0; background: transparent; color: var(--suave); border-radius: 10px; }
    .icono-boton:hover { background: var(--panel); color: var(--negativo); }

    main { flex: 1; min-width: 0; padding: 28px 32px 40px; max-width: 1280px; }
    .encabezado { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    h2 { margin: 22px 0 12px; font-size: 16px; font-weight: 700; }
    .panel h2:first-child, .encabezado h2 { margin-top: 0; }
    a.volver {
      color: inherit; text-decoration: none; width: 38px; height: 38px; border-radius: 12px;
      display: inline-grid; place-items: center; background: var(--panel); box-shadow: var(--sombra); font-size: 20px;
    }

    /* Tarjetas y paneles */
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .tarjeta, .panel { background: var(--panel); border-radius: var(--radio); padding: 18px; box-shadow: var(--sombra); }
    .panel { margin-bottom: 20px; }
    .tarjeta small { color: var(--suave); display: block; margin-bottom: 6px; font-weight: 500; }
    .tarjeta strong { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .columnas { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .columnas .panel { margin-bottom: 0; }

    /* Tablas */
    .tabla { overflow-x: auto; margin: 0 -4px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    th, td { padding: 12px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
    tbody tr:hover td { background: #fafbfc; }
    tr:last-child td { border-bottom: 0; }
    td.ancho { white-space: normal; min-width: 150px; font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .acciones { text-align: right; }
    .acciones button, .acciones .boton { margin-left: 4px; }
    .anulada td, tr.inactivo td { color: var(--suave); }
    .anulada td:not(.acciones) { text-decoration: line-through; }

    .positivo { color: var(--positivo); }
    .negativo { color: var(--negativo); }
    .suave { color: var(--suave); }
    .vacio { color: var(--suave); padding: 28px 12px; margin: 0; text-align: center; }
    .etiqueta {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
      background: var(--fondo); color: var(--suave);
    }
    .estado-nuevo { background: var(--alerta-suave); color: var(--alerta); }
    .estado-cocina { background: var(--acento-suave); color: var(--acento-oscuro); }
    .estado-listo { background: var(--positivo-suave); color: var(--positivo); }
    .estado-entregado { background: var(--fondo); color: var(--suave); }

    /* Botones y formularios */
    button, .boton {
      font: inherit; font-weight: 600; cursor: pointer; min-height: 44px;
      border: 1px solid var(--borde); border-radius: 12px; padding: 10px 16px;
      background: var(--panel); color: var(--texto); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    button:hover, .boton:hover { border-color: #cfd1da; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: default; transform: none; }
    button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
    button.principal:hover { background: var(--acento-oscuro); border-color: var(--acento-oscuro); }
    button.chico, .boton.chico { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
    button.peligro { color: var(--negativo); }
    button.peligro:hover { background: var(--negativo-suave); border-color: #f5c2c2; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--suave); }
    label.opcion { flex-direction: row; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: var(--texto); padding: 6px 0; cursor: pointer; }
    label.opcion input { width: 20px; height: 20px; min-height: 0; accent-color: var(--acento); flex-shrink: 0; }
    input, select {
      font: inherit; font-weight: 500; color: var(--texto); background: var(--panel);
      padding: 11px 12px; border: 1px solid var(--borde); border-radius: var(--radio-chico);
      width: 100%; min-width: 0; min-height: 44px; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
    fieldset { border: 1px solid var(--borde); border-radius: var(--radio-chico); margin: 0; padding: 8px 14px 10px; }
    legend { font-weight: 700; padding: 0 6px; }
    .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
    .filtros label { width: 170px; }
    .pestanas { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; padding-bottom: 2px; }
    .pestanas button { min-height: 38px; border-radius: 99px; padding: 6px 16px; white-space: nowrap; background: var(--panel); }
    .pestanas button.activo { background: var(--texto); color: #fff; border-color: var(--texto); }
    .lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .fila-lista { display: flex; gap: 8px; align-items: center; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
    .linea { display: grid; grid-template-columns: 1fr 110px 44px; gap: 8px; align-items: center; }
    .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; font-weight: 800; border-top: 1px dashed var(--borde); padding-top: 14px; margin-top: 6px; }
    .error { color: var(--negativo); margin: 0; font-size: 14px; font-weight: 500; background: var(--negativo-suave); padding: 10px 12px; border-radius: var(--radio-chico); }
    .error[hidden] { display: none; }
    .botones { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

    /* Mesas */
    .mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .mesa {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px;
      padding: 18px; min-height: 124px; text-align: left; border-radius: var(--radio);
      border: 2px solid transparent; background: var(--panel); box-shadow: var(--sombra);
    }
    .mesa:hover { border-color: var(--borde); }
    .mesa strong { font-size: 18px; font-weight: 700; }
    .estado-mesa { display: inline-flex; align-items: center; gap: 6px; color: var(--positivo); font-size: 13px; font-weight: 600; }
    .estado-mesa::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .mesa.ocupada { background: var(--acento-suave); border-color: #ffd5c4; }
    .total-mesa { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--acento-oscuro); }
    .mesa.ocupada small { color: var(--suave); font-weight: 500; }
    .mesa.listo { background: var(--positivo-suave); border-color: var(--positivo); animation: latido 1.6s ease-in-out infinite; }
    .mesa.listo .total-mesa { color: var(--positivo); }
    .mesa.listo small { color: var(--positivo); font-weight: 700; }
    @keyframes latido { 0%, 100% { box-shadow: var(--sombra); } 50% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.15); } }

    /* Domicilios */
    .lista-domicilios { display: flex; flex-direction: column; gap: 10px; }
    .domicilio {
      display: flex; justify-content: space-between; gap: 12px; text-align: left; padding: 16px 18px;
      border: 0; border-radius: var(--radio); box-shadow: var(--sombra); font-weight: 400;
    }
    .domicilio strong { font-size: 16px; }
    div.domicilio { background: var(--panel); }
    .domicilio .num { text-align: right; flex-shrink: 0; }
    .botones-domicilio { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
    .lista-domicilios + h2 { margin-top: 24px; }

    /* Cuenta de una mesa */
    .cuenta { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
    /* Nada dentro de la cuenta puede ensanchar la página: la barra de categorías se desliza sola */
    .carta, .resumen, .pestanas { min-width: 0; max-width: 100%; }
    .plato strong, .item > div, .item > span:first-child { overflow-wrap: anywhere; min-width: 0; }
    .resumen { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 76px; }
    .resumen .panel { margin-bottom: 0; }
    .platos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .plato {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px;
      text-align: left; min-height: 96px; padding: 14px; border: 0; border-radius: 14px; box-shadow: var(--sombra);
    }
    .plato:hover { box-shadow: 0 0 0 2px var(--acento-suave), var(--sombra); }
    /* Contador de toques seguidos al mismo plato (+1, +2…) antes de agregarlos */
    .plato { position: relative; }
    .plato .contador {
      position: absolute; top: 8px; right: 8px; min-width: 30px; padding: 3px 9px; border-radius: 999px;
      background: var(--acento); color: #fff; font-weight: 800; font-size: 14px; text-align: center;
      animation: contar 0.18s ease-out;
    }
    @keyframes contar { from { transform: scale(1.4); } }
    .plato[hidden] { display: none; }
    .plato strong { font-weight: 600; line-height: 1.25; }
    .plato span { color: var(--acento-oscuro); font-weight: 700; }
    .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--borde); }
    .item:first-child { padding-top: 0; }
    .item .num { font-weight: 700; }
    .item .num button { margin-top: 6px; }
    .item:has(+ .total) { border-bottom: 0; }
    .item .etiqueta { margin-top: 6px; }
    .acciones-cuenta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .acciones-cuenta button { min-height: 52px; font-size: 15px; }
    .acciones-cuenta button:only-child { grid-column: 1 / -1; }
    #cobrar { background: var(--texto); border-color: var(--texto); }
    #cobrar:hover { background: #000; }
    .ver-cuenta { display: none; }

    /* Cocina */
    .comandas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .comanda {
      background: var(--panel); border-radius: var(--radio); padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--sombra); border-top: 5px solid var(--acento);
    }
    .comanda.demorada { border-top-color: var(--negativo); background: #fffafa; }
    .comanda-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 17px; }
    .comanda-cabeza span { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--fondo); color: var(--suave); }
    .comanda.demorada .comanda-cabeza span { background: var(--negativo-suave); color: var(--negativo); }
    .comanda ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .comanda li { padding-bottom: 8px; border-bottom: 1px dashed var(--borde); font-size: 16px; }
    .comanda li:last-child { border-bottom: 0; padding-bottom: 0; }
    .comanda li small { color: var(--suave); }
    .botones-comanda { display: flex; gap: 8px; margin-top: auto; }
    .botones-comanda button { flex: 1; min-height: 48px; }

    /* Ajustes */
    .guia ol { padding-left: 20px; line-height: 1.6; margin: 0; }
    .guia li { margin-bottom: 10px; }
    .guia pre { white-space: pre-wrap; word-break: break-all; background: var(--fondo); padding: 10px 12px; border-radius: var(--radio-chico); font-size: 13px; }
    .formulario-plano { display: flex; flex-direction: column; gap: 14px; }

    /* Entrada */
    .acceso { max-width: 400px; margin: 9vh auto 0; display: flex; flex-direction: column; gap: 20px; }
    .acceso-marca { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .acceso-marca .logo { width: 64px; height: 64px; border-radius: 20px; font-size: 32px; margin-bottom: 6px; }
    .acceso-marca h1 { font-size: 28px; letter-spacing: 3px; }
    .acceso-marca p { margin: 0; }
    .acceso .panel { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .acceso .panel p { margin: 0; }
    .acceso form { display: flex; flex-direction: column; gap: 14px; }
    .acceso button.principal { min-height: 50px; font-size: 16px; }

    /* Ventanas */
    dialog {
      width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
      border: 0; border-radius: 20px; padding: 0; background: var(--panel); color: var(--texto); box-shadow: var(--sombra-alta);
    }
    dialog[open] { animation: aparecer 0.18s ease-out; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    dialog::backdrop { background: rgba(20, 22, 31, 0.45); backdrop-filter: blur(2px); }
    dialog form, dialog .contenido { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    dialog h2 { margin: 0; font-size: 20px; font-weight: 800; }
    dialog .botones { margin-top: 4px; }
    dialog .botones button { min-width: 120px; }

    /* Multicuenta: repartir los productos entre varias cuentas arrastrándolos */
    @media (min-width: 761px) { dialog.ancho { width: min(1100px, calc(100vw - 32px)); } }
    .mc-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .mc-zona { border: 2px dashed var(--borde); border-radius: var(--radio); padding: 12px; transition: border-color 0.15s, background 0.15s; }
    .mc-zona.encima { border-color: var(--acento); background: var(--acento-suave); }
    .mc-sin { background: var(--fondo); }
    .mc-cuentas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .mc-cuenta { border-style: solid; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
    .mc-titulo { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
    .mc-fichas { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; align-content: flex-start; }
    .mc-ficha {
      touch-action: none; user-select: none; cursor: grab; min-height: 0; padding: 8px 12px; border-radius: 999px;
      border: 1px solid var(--borde); background: var(--panel); font-weight: 600; font-size: 14px; box-shadow: var(--sombra);
    }
    .mc-ficha small { color: var(--suave); font-weight: 400; margin-left: 4px; }
    .mc-ficha.elegida { border-color: var(--acento); background: var(--acento-suave); color: var(--acento-oscuro); }
    .mc-ficha.arrastrando { opacity: 0.35; }
    .mc-fantasma { position: fixed; pointer-events: none; z-index: 10; margin: 0; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: var(--sombra-alta); }
    .mc-vacia { margin: auto; color: var(--suave); font-size: 13px; text-align: center; }
    .mc-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
    .mc-total strong { font-size: 20px; }
    .mc-nueva {
      border: 2px dashed var(--borde); border-radius: var(--radio); background: transparent; color: var(--suave);
      min-height: 170px; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .mc-nueva span { font-size: 34px; line-height: 1; }
    .mc-nueva:hover { border-color: var(--acento); color: var(--acento-oscuro); background: var(--acento-suave); }
    #aviso {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--texto); color: #fff; padding: 12px 18px; border-radius: 14px; z-index: 20;
      max-width: calc(100vw - 32px); box-shadow: var(--sombra-alta); font-weight: 500;
    }
    #aviso[hidden] { display: none; }

    @media (max-width: 960px) {
      .cuenta { grid-template-columns: minmax(0, 1fr); padding-bottom: 70px; }
      .resumen { position: static; }
      .ver-cuenta {
        display: flex; justify-content: space-between; position: fixed; left: 16px; right: 16px; z-index: 5;
        bottom: 20px; min-height: 54px; border: 0; border-radius: 16px;
        background: var(--texto); color: #fff; box-shadow: var(--sombra-alta); padding: 12px 18px; font-weight: 600;
      }
      .ver-cuenta strong { font-size: 17px; }
    }

    /* Celular: barra superior con la marca y barra inferior con las secciones */
    @media (max-width: 760px) {
      .app { display: block; }
      nav { display: contents; }
      nav[hidden] { display: none; }
      .marca {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10; height: calc(60px + env(safe-area-inset-top)); padding: 0 16px;
        padding-top: env(safe-area-inset-top); background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--borde); font-size: 17px;
      }
      .marca .logo { width: 32px; height: 32px; font-size: 16px; }
      nav .pie {
        position: fixed; top: 0; right: 0; z-index: 11; height: calc(60px + env(safe-area-inset-top)); padding: 0 10px; margin: 0;
        padding-top: env(safe-area-inset-top); flex-direction: row; align-items: center; gap: 6px;
      }
      .comandera { padding: 8px; border-radius: 10px; }
      .comandera span { display: none; }
      .usuario { background: transparent; padding: 0; gap: 4px; }
      .quien { display: none; }
      .avatar { width: 32px; height: 32px; font-size: 14px; }
      .secciones {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; flex-direction: row; gap: 2px;
        background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--borde);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto; scrollbar-width: none;
      }
      .secciones a {
        flex: 1 0 68px; flex-direction: column; gap: 3px; padding: 8px 4px; font-size: 11px; text-align: center; border-radius: 12px;
      }
      /* Nombre corto en la barra de abajo (ej. "Menú" en vez de "Menú y recetas") */
      .secciones a span { font-size: 0; line-height: 1.2; }
      .secciones a span::after { content: attr(data-corto); font-size: 11px; white-space: nowrap; }
      .secciones .icono { width: 22px; height: 22px; }
      main { padding: calc(76px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); }
      h1 { font-size: 22px; }
      .mesas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .mesa { min-height: 112px; padding: 14px; }
      .platos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .acciones-cuenta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .acciones-cuenta button { white-space: normal; }
      .fila { grid-template-columns: 1fr; }
      .tarjetas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .tarjeta { padding: 14px; }
      .tarjeta strong { font-size: 19px; }
      .columnas { grid-template-columns: minmax(0, 1fr); }
      /* Último seguro: la página nunca se desliza de lado en el celular */
      main { overflow-x: clip; }
      .panel { padding: 14px; }
      .ver-cuenta { bottom: calc(84px + env(safe-area-inset-bottom)); }
      /* Tablas como tarjetas: cada fila es un bloque y cada dato muestra su nombre */
      .tabla { overflow: visible; margin: 0; }
      .tabla table, .tabla tbody, .tabla tr, .tabla td { display: block; width: 100%; }
      .tabla thead { display: none; }
      .tabla tr { padding: 12px 0; border-bottom: 1px solid var(--borde); }
      .tabla tr:first-child { padding-top: 0; }
      .tabla tr:last-child { border-bottom: 0; padding-bottom: 0; }
      .tabla td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; white-space: normal; text-align: right; }
      .tabla td::before { content: attr(data-columna); color: var(--suave); font-size: 13px; font-weight: 500; text-align: left; flex-shrink: 0; }
      .tabla td.ancho { font-size: 16px; font-weight: 700; text-align: left; justify-content: flex-start; }
      .tabla td.ancho::before, .tabla td.acciones::before, .tabla td[data-columna=""]::before { display: none; }
      .tabla td.acciones { justify-content: flex-start; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
      .tabla td.acciones:empty { display: none; }
      .tabla td.acciones button, .tabla td.acciones .boton { margin: 0; }
      tbody tr:hover td { background: transparent; }
      .acceso { margin-top: 6vh; }
      /* Las ventanas salen desde abajo, como en las apps */
      dialog {
        width: 100%; max-width: 100%; max-height: 92vh; margin: auto 0 0; border-radius: 22px 22px 0 0;
        padding-bottom: env(safe-area-inset-bottom);
      }
      dialog[open] { animation: subir 0.22s ease-out; }
      @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      dialog .botones { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
      dialog .botones button { flex: 1; min-width: 0; }
      #aviso { bottom: calc(150px + env(safe-area-inset-bottom)); }
    }

    /* Tickets de 80 mm: solo existen al imprimir */
    #impresion { display: none; }
    @media print {
      @page { margin: 0; }
      body.imprimiendo > *:not(#impresion) { display: none !important; }
      body.imprimiendo #impresion { display: block; }
      body.imprimiendo { background: #fff; }
    }
    /* Espacio arriba: la comandera corta un pedacito al inicio de cada ticket */
    .ticket { width: 72mm; padding: 12mm 3mm 6mm; font-family: "Courier New", monospace; font-size: 12pt; color: #000; line-height: 1.25; }
    .ticket hr { border: 0; border-top: 1px dashed #000; margin: 2mm 0; }
    .t-centro { text-align: center; }
    .t-negocio { font-size: 15pt; font-weight: 700; }
    /* Logo en blanco y negro: la comandera térmica solo imprime en negro */
    .t-logo { display: block; margin: 0 auto 2mm; max-width: 40mm; max-height: 25mm; filter: grayscale(1) contrast(1.4); }
    .t-chico { font-size: 9pt; }
    .t-fila { display: flex; justify-content: space-between; gap: 2mm; }
    .t-total { font-size: 15pt; font-weight: 700; }
    .t-detalle { padding-left: 4mm; font-size: 11pt; }
    .comanda-ticket { font-size: 14pt; font-weight: 700; }
    .comanda-ticket .t-grande { font-size: 22pt; }
    .comanda-ticket .t-plato { font-size: 16pt; margin-top: 2mm; }
    .comanda-ticket .t-detalle { font-size: 13pt; }
  </style>
</head>
<body>
  <div class="app">
    <nav id="menu" hidden></nav>
    <main id="vista"></main>
  </div>
  <dialog id="dialogo"></dialog>
  <div id="aviso" role="status" hidden></div>
  <div id="impresion"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script type="module" src="/sistema/app.js"></script>
</body>
</html>
